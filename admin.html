<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>رفع الصور</title></head>
<body style="text-align:center;padding:30px;font-family:sans-serif">
<h1>ارفع صورتك</h1>
<input type="file" id="f"><br><br>
<button onclick="u()">رفع</button>
<p id="r"></p>
<script>
async function u(){
let file=document.getElementById('f').files[0];
let d=new FormData();
d.append('reqtype','fileupload');
d.append('fileToUpload',file);
document.getElementById('r').innerText='جاري الرفع...';
let res=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:d});
let url=await res.text();
document.getElementById('r').innerHTML='رابطك:<br><b>'+url+'</b><br><br><input value="'+url+'" style="width:90%">';}
</script>
</body>
</html>
