<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مسجد سيدي عيسى</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;text-align:center;padding:15px}
.top{border:1px solid #c9a227;border-radius:15px;padding:12px;margin-bottom:12px}
.top h1{color:#f5c518;font-size:22px}
.top p{font-size:15px;margin-top:5px}
.date-box{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
.date-box div{font-size:17px;margin:5px 0}
.date-box b{color:#f5c518}
.count{font-size:14px;color:#ccc;margin-top:8px}

.row{display:flex;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #222;font-size:18px}
.row:last-child{border:none}
.row.active{background:#f5c518;color:#000;font-weight:bold}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.btn-gold{background:#f5c518;color:#000}

small{color:#999;font-size:13px;line-height:1.7;display:block;margin-top:8px}
</style>
</head>
<body>

<div class="top">
<h1>🕌 مسجد سيدي عيسى</h1>
<p>حيّ على الصلاة - سيدي عيسى، المسيلة، الجزائر</p>
</div>

<div>🌙 الهجري: <b id="hijri">جاري التحميل...</b></div>
<div id="nextPrayer" class="count">...</div>
</div>

<div class="prayer" id="prayers"></div>

<button class="btn-gold" id="adhanBtn" onclick="enableAdhan()">🔊 تفعيل الأذان الأوتوماتيك</button>
<button class="btn-green" id="installBtn" style="display:none">📲 تحميل التطبيق</button>

<audio id="adhanAudio" src="adhan.mp3" preload="auto"></audio>

<small>1- دير على "تفعيل الأذان" مرة وحدة<br>2- من بعد كي يلحق وقت الصلاة الأذان يخدم وحدو<br>3- ملف الأذان اسمه <b>adhan.mp3</b> بجانب الصفحة</small>

<script>
// === التاريخ الميلادي + الهجري ===
var now = new Date();
try {
  document.getElementById('greg').textContent = now.toLocaleDateString('ar-DZ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
} catch(e){
  document.getElementById('greg').textContent = now.toDateString();
}
try {
  document.getElementById('hijri').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(now);
} catch(e){
  try{
    document.getElementById('hijri').textContent = new Intl.DateTimeFormat('ar-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(now);
  }catch(e2){
    document.getElementById('hijri').textContent = "17 جمادى الأولى 1448 هـ";
  }
}

// === أوقات الصلاة سيدي عيسى - داخل الكود ===
var times = {"Fajr":"05:42","Sunrise":"07:08","Dhuhr":"12:36","Asr":"15:28","Maghrib":"17:54","Isha":"19:18"};
var names = {"Fajr":"الفجر","Sunrise":"الشروق","Dhuhr":"الظهر","Asr":"العصر","Maghrib":"المغرب","Isha":"العشاء"};

function render(){
  var h="";
  var n=new Date();
  var cur=n.getHours()*60+n.getMinutes();
  var nextName="", nextDiff=99999;
  for(var k in names){
    var p=times[k].split(":");
    var mins=parseInt(p[0])*60+parseInt(p[1]);
    var isActive = Math.abs(cur-mins)<30;
    if(mins>cur && mins-cur<nextDiff){nextDiff=mins-cur; nextName=names[k];}
    h+='<div class="row '+(isActive?'active':'')+'"><span>'+names[k]+'</span><span>'+times[k]+'</span></div>';
  }
  document.getElementById('prayers').innerHTML=h;
  if(nextName){
    var hh=Math.floor(nextDiff/60), mm=nextDiff%60;
    document.getElementById('nextPrayer').textContent="الصلاة القادمة: "+nextName+" بعد "+hh+" سا و "+mm+" د";
  } else {
    document.getElementById('nextPrayer').textContent="الصلاة القادمة: الفجر غداً";
  }
}
render();

// === تحديث الأوقات من الانترنت - سيدي عيسى بالإحداثيات ===
fetch("https://api.aladhan.com/v1/timings?latitude=35.886&longitude=3.774&method=5")
.then(function(r){return r.json()}).then(function(d){
  if(d.data && d.data.timings){
    times.Fajr=d.data.timings.Fajr.slice(0,5);
    times.Sunrise=d.data.timings.Sunrise.slice(0,5);
    times.Dhuhr=d.data.timings.Dhuhr.slice(0,5);
    times.Asr=d.data.timings.Asr.slice(0,5);
    times.Maghrib=d.data.timings.Maghrib.slice(0,5);
    times.Isha=d.data.timings.Isha.slice(0,5);
    render();
  }
}).catch(function(){});
