<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذان سيدي عيسى</title>
<style>
body{background:#0f3d2e;color:white;text-align:center;padding:20px;font-family:Arial}
h1{font-size:32px}
.sub{color:#ffd700;margin-bottom:20px}
.box{background:#1a5a44;padding:15px;border-radius:15px;margin-bottom:15px}
#clock{font-size:55px;font-weight:bold}
#next{background:#ffd700;color:#000;padding:15px;border-radius:15px;font-weight:bold;margin:15px 0}
#next span{font-size:28px;display:block}
.prayer{display:flex;justify-content:space-between;background:white;color:#222;padding:14px;margin:8px 0;border-radius:12px;font-size:20px;font-weight:bold}
.prayer.active{background:#ffd700}
button{background:#ffd700;border:0;padding:15px;border-radius:50px;font-size:19px;font-weight:bold;margin-top:12px;width:100%}
</style>
</head>
<body>
<h1>🕌 أذان سيدي عيسى</h1>
<div class="sub">سيدي عيسى - المسيلة</div>
<div class="box"><div id="clock">--:--:--</div><div>الأحد 8 نوفمبر 2026 - سيدي عيسى</div></div>
<div id="next">...</div>
<div id="list"></div>
<button onclick="playAdhan()">▶ تشغيل الأذان الآن</button>
<small>الأوقات تقريبية لسيدي عيسى</small>
<audio id="a" src="https://cdn.aladhan.com/audio/adhan/a1.mp3"></audio>
<script>
var times = {};
times.Fajr = "05:45";
times.Sunrise = "07:10";
times.Dhuhr = "12:45";
times.Asr = "15:55";
times.Maghrib = "18:20";
times.Isha = "19:45";
var order = ["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
var names = {};
names.Fajr = "الفجر";
names.Sunrise = "الشروق";
names.Dhuhr = "الظهر";
names.Asr = "العصر";
names.Maghrib = "المغرب";
names.Isha = "العشاء";
function render(){
  var html = "";
  for(var i=0;i<order.length;i++){
    var k = order[i];
    html = html + '<div class="prayer" id="p-'+k+'"><span>'+names[k]+'</span><span>'+times[k]+'</span></div>';
  }
  document.getElementById("list").innerHTML = html;
}
function playAdhan(){
  var au = document.getElementById("a");
  au.play();
  alert("راهو يخدم الأذان 🔊");
}
function tick(){
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  var s = now.getSeconds();
  if(h<10) h="0"+h;
  if(m<10) m="0"+m;
  if(s<10) s="0"+s;
  document.getElementById("clock").innerText = h+":"+m+":"+s;
  var nextName = "Fajr";
  var nextTime = null;
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(k==="Sunrise") continue;
    var parts = times[k].split(":");
    var d = new Date();
    d.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
    if(d > now){ nextName = k; nextTime = d; break; }
  }
  if(nextTime === null){
    var p2 = times["Fajr"].split(":");
    var d2 = new Date();
    d2.setDate(d2.getDate()+1);
    d2.setHours(parseInt(p2[0]), parseInt(p2[1]), 0, 0);
    nextName = "Fajr";
    nextTime = d2;
  }
  var diff = nextTime - now;
  var hh = Math.floor(diff/3600000);
  var mm = Math.floor(diff%3600000/60000);
  var ss = Math.floor(diff%60000/1000);
  document.getElementById("next").innerHTML = "الصلاة القادمة: " + names[nextName] + " - " + times[nextName] + "<span>" + hh + " سا : " + mm + " د : " + ss + " ثا</span>";
}
render();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
