<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسجد سيدي عيسى - عبدلي فارس</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:15px}
.top{border:1px solid #c9a227;border-radius:15px;padding:12px;margin-bottom:12px}
.top h1{color:#f5c518;font-size:23px}
.date{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px;cursor:pointer}
.date b{color:#f5c518}
.prayer{background:#111;border-radius:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #222;font-size:18px}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;margin-bottom:10px;cursor:pointer}
.g{background:#f5c518;color:#000}
.d{background:#222;color:#fff;border:1px solid #444}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
.cal{background:#111;border:1px solid #c9a227;border-radius:12px;padding:12px;margin-bottom:12px;display:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:#222;border-radius:6px;padding:7px 2px;font-size:13px}
.day.today{background:#f5c518;color:#000}
.day small{display:block;font-size:10px}
</style>
</head>
<body>
<div class="top">
<h1>🕌 مسجد سيدي عيسى</h1>
<p>سيدي عيسى، المسيلة</p>
<p style="color:#f5c518">بإشراف: عبدلي فارس</p>
</div>
<div class="date" onclick="toggleCal()">
<div>📅 الميلادي: <b id="greg">الأحد 8 نوفمبر 2026</b></div>
<div>🌙 الهجري: <b id="hijri">17 جمادى الأولى 1448 هـ</b></div>
<div style="color:#f5c518;font-size:12px">👆 اضغط هنا للشهرية</div>
</div>
